<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Club Parque Tenis</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <img src="assets/logo.png" alt="Logo Club Parque Tenis" class="logo">

    <h1>CLUB PARQUE TENIS</h1>

    <p>Ranking Oficial</p>

</header>

<main>

    <div class="buscador">

    <input
        type="text"
        id="buscarJugador"
        placeholder="🔍 Buscar jugador..."
        onkeyup="buscarJugador()"
    >

    <div id="resultadoBusqueda"></div>

</div>

<div class="menu">

<button class="categoria" onclick="mostrarCategoria('A1')">CAT A1</button>

<button class="categoria" onclick="mostrarCategoria('A2')">CAT A2</button>

<button class="categoria" onclick="mostrarCategoria('B1')">CAT B1</button>

<button class="categoria" onclick="mostrarCategoria('B2')">CAT B2</button>

<button class="categoria" onclick="mostrarCategoria('C')">CAT C</button>

</div>

<div id="ranking">

<h2>Seleccioná una categoría</h2>

</div>

<div id="modalJugador" class="modal">

    <div class="modal-contenido">

        <span class="cerrar" onclick="cerrarModal()">&times;</span>

        <div id="fichaJugador"></div>

    </div>

</div>
</main>

<script src="script.js"></script>

</body>
</html>
